[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life_expectancy"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
description = "Cleaning pipeline for Eurostat life expectancy data (Strategy + Factory patterns)"
license = {file = "LICENSE.md"}
authors = [
    {name = "Filipe Carmo", email = "filipe.brandao.carmo@gmail.com"}
]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pylint", "pytest-cov"]

[project.scripts]
life-expectancy = "life_expectancy.cleaning:cli"

[tool.setuptools]
packages = ["life_expectancy"]

[tool.coverage.run]
omit = [
    "*/conftest.py", "*/test*", # omit test files
]

[tool.coverage.report]
fail_under = 80

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods"
]

[tool.pylint."format"]
max-line-length = 110
